<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海軍懸賞令 - 關卡控制器</title>
    <style>
        :root {
            --paper-bg: #f4e4bc;
            --paper-border: #8c5a2b;
            --navy-blue: #1b365d;
            --gold: #d4af37;
            --red: #a82222;
            --dark-wood: #3a2212;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
        }

        body {
            background-color: #2c1d11;
            background-image: radial-gradient(#4a321e 15%, transparent 16%), radial-gradient(#4a321e 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .header {
            text-align: center;
            color: #fff;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .header h1 {
            font-size: 1.8rem;
            color: var(--gold);
            letter-spacing: 2px;
        }

        .header p {
            font-size: 0.9rem;
            color: #ddd;
        }

        /* 主容器布局 */
        .app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1000px;
            gap: 15px;
        }

        @media (min-width: 768px) {
            .app-container {
                flex-direction: row;
            }
        }

        /* 左側：海軍操作面板 */
        .control-panel {
            flex: 1.2;
            background: #2a1a0e;
            border: 3px solid var(--gold);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            max-height: 85vh;
            overflow-y: auto;
        }

        .panel-title {
            color: var(--gold);
            font-size: 1.1rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: #2a1a0e;
            z-index: 5;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .btn {
            background: linear-gradient(135deg, #4a2e1b, #2b170c);
            color: #f0e6d2;
            border: 2px solid #8c5a2b;
            padding: 10px 6px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .btn:hover, .btn:active {
            background: var(--navy-blue);
            border-color: var(--gold);
            color: var(--gold);
            transform: translateY(-2px);
        }

        .btn.active {
            background: var(--navy-blue);
            border-color: var(--gold);
            color: #fff;
            box-shadow: 0 0 10px var(--gold);
        }

        .btn-action {
            background: linear-gradient(135deg, var(--red), #600);
            border-color: #ff6b6b;
            color: white;
        }

        .btn-random {
            background: linear-gradient(135deg, #2b5c8f, #11233b);
            border-color: #4a90e2;
            color: white;
            grid-column: span 2;
        }

        /* 海軍台詞區 */
        .lines-box {
            background: #180e07;
            border: 1px solid #5c3a1e;
            border-radius: 8px;
            padding: 10px;
            color: #e0d0b0;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .lines-box h4 {
            color: var(--gold);
            margin-bottom: 5px;
            font-size: 0.85rem;
        }

        .dialogue-btn {
            background: #3a2212;
            border: 1px solid #8c5a2b;
            color: #f4e4bc;
            padding: 6px 10px;
            margin-top: 5px;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            width: 100%;
            text-align: left;
        }

        .dialogue-btn:hover {
            background: var(--navy-blue);
        }

        /* 右側：懸賞令展示卡片 */
        .display-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wanted-card {
            background: var(--paper-bg);
            border: 12px solid var(--paper-border);
            outline: 3px solid #3a2212;
            border-radius: 4px;
            width: 100%;
            padding: 20px 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background-image: radial-gradient(#e2ce9f 10%, transparent 11%);
            background-size: 20px 20px;
        }

        .wanted-header {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 6px;
            color: var(--dark-wood);
            line-height: 1;
            margin-bottom: 5px;
            border-bottom: 3px double var(--dark-wood);
            width: 100%;
            padding-bottom: 5px;
        }

        .wanted-sub {
            font-size: 1rem;
            font-weight: bold;
            color: #5a3d28;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        /* 大圖展示區 */
        .image-box {
            width: 100%;
            height: 250px;
            background: #e8d5a7;
            border: 4px solid var(--dark-wood);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
        }

        .image-box svg {
            width: 80%;
            height: 80%;
            filter: drop-shadow(3px 5px 4px rgba(0,0,0,0.3));
        }

        .target-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--red);
            margin-bottom: 8px;
            text-shadow: 1px 1px 0px #fff;
        }

        .target-hint {
            font-size: 1.05rem;
            font-weight: bold;
            color: #3a2212;
            background: rgba(255, 255, 255, 0.5);
            padding: 8px 12px;
            border-radius: 20px;
            border: 1px dashed var(--paper-border);
            width: 100%;
        }

        /* 成果蓋章印章 */
        .stamp {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg) scale(0);
            font-size: 3rem;
            font-weight: 900;
            color: var(--red);
            border: 6px double var(--red);
            padding: 10px 20px;
            border-radius: 12px;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0;
            background: rgba(244, 228, 188, 0.9);
            z-index: 10;
        }

        .stamp.show {
            transform: translate(-50%, -50%) rotate(-15deg) scale(1);
            opacity: 0.95;
        }

        /* 全螢幕觀看模式 */
        .fullscreen-card {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999;
            border-width: 20px;
            justify-content: center;
        }

        .fullscreen-card .image-box {
            height: 55vh;
        }

        .fullscreen-card .target-title {
            font-size: 4rem;
        }

        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚓ 海軍總部 懸賞發布系統 ⚓</h1>
        <p>活動：海軍懸賞令</p>
    </div>

    <div class="app-container">
        <!-- 左側：海軍關主控制區 -->
        <div class="control-panel">
            <div class="panel-title">
                <span>選擇挑戰題目</span>
             
            </div>

            <div class="topic-grid">
                <button class="btn" onclick="selectTopic('flag')">🏴‍☠️ 海賊旗</button>
                <button class="btn" onclick="selectTopic('skull')">💀 骷髏頭</button>
                <button class="btn" onclick="selectTopic('ship')">⛵ 海賊船</button>
                <button class="btn" onclick="selectTopic('cannon')">💣 無敵大砲</button>
                <button class="btn" onclick="selectTopic('balls')">⚫ 重裝砲彈</button>
                <button class="btn" onclick="selectTopic('anchor')">⚓ 重型船錨</button>
                <button class="btn" onclick="selectTopic('wheel')">☸️ 航海船舵</button>
                <button class="btn" onclick="selectTopic('chest')">💎 藏寶箱</button>
                <button class="btn" onclick="selectTopic('map')">🗺️ 藏寶圖</button>
                <button class="btn" onclick="selectTopic('barrel')">🪵 木酒桶</button>
                <button class="btn" onclick="selectTopic('lantern')">🏮 海軍提燈</button>
                <button class="btn" onclick="selectTopic('pistol')">🔫 火繩槍</button>
                <button class="btn" onclick="selectTopic('rapier')">🗡️ 西洋劍</button>
                <button class="btn" onclick="selectTopic('cutlass')">⚔️ 海賊彎刀</button>
                <button class="btn" onclick="selectTopic('hook')">🪝 鐵鉤手</button>
                <button class="btn" onclick="selectTopic('hat')">🎩 海賊帽</button>
                <button class="btn" onclick="selectTopic('strawhat')">👒 經典草帽</button>
                <button class="btn" onclick="selectTopic('telescope')">🔭 望遠鏡</button>

                <button class="btn btn-random" onclick="selectRandomTopic()">🎲 隨機抽取題目</button>
            </div>

            
        </div>

        <!-- 右側：大圖懸賞令卡片（展示給小朋友看） -->
        <div class="display-panel">
            <div class="wanted-card" id="wantedCard">
                <button class="fullscreen-btn" onclick="toggleFullscreen()">全螢幕展示</button>
                
                <div class="wanted-header">WANTED</div>
                <div class="wanted-sub">=== 海軍素材搜集令 ===</div>

                <!-- 大圖展示區 -->
                <div class="image-box" id="imageBox">
                    <!-- SVG圖案會由動態腳本注入 -->
                </div>

                <div class="target-title" id="targetTitle">請選擇題目</div>
                <div class="target-hint" id="targetHint">使用樹枝、落葉、石頭組合成圖案！</div>

                <!-- 印章特效 -->
                <div class="stamp" id="stampBox">COMPLETED</div>
            </div>
        </div>
    </div>

    <script>
        // 題目資料庫 (擴充所有圖片中的海賊元素)
        const topics = {
            flag: {
                title: "海賊旗",

                    <rect x="15" y="10" width="8" height="85" fill="#5a3d28" rx="2"/>

                </svg>`
            },

                title: "骷髏頭",

                    <path d="M15 60 L85 60 L75 85 L25 85 Z" fill="#8c5a2b" stroke="#3a2212" stroke-width="3"/>

                    <path d="M47 25 C30 28, 30 42, 47 45 Z" fill="#eee" stroke="#333" stroke-width="2"/>
                </svg>`
            },
            cannon: {
                title: "無敵大砲",

                    <path d="M30 35 L75 25 L80 45 L35 55 Z" fill="#3a4b5c" stroke="#111" stroke-width="2"/>

            balls: {

                svg: `<svg viewBox="0 0 100 100">
                    <circle cx="35" cy="65" r="18" fill="#2c3e50" stroke="#111" stroke-width="3"/>
                    <circle cx="65" cy="65" r="18" fill="#34495e" stroke="#111" stroke-width="3"/>
                    <circle cx="50" cy="38" r="18" fill="#1a252f" stroke="#111" stroke-width="3"/>
                </svg>`
            },
            anchor: {
                title: "重型船錨",
                hint: "請用【樹枝、彎曲的落葉】拼出金屬船錨！",

            },
            chest: {
                title: "藏寶箱",
                hint: "請用【方形樹皮、黃色葉子】疊出寶箱！",
                svg: `<svg viewBox="0 0 100 100">
                    <rect x="20" y="45" width="60" height="35" fill="#8c5a2b" stroke="#3a2212" stroke-width="3"/>

                title: "西洋劍",
                hint: "請找【一根超長超直的樹枝】當作細長劍！",
                svg: `<svg viewBox="0 0 100 100">
                    <path d="M20 80 L85 15 L80 10 L15 75 Z" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>

                hint: "請用【長短不同的樹枝】拼出一隻望遠鏡！",
                svg: `<svg viewBox="0 0 100 100">
                    <rect x="15" y="40" width="25" height="20" fill="#d4af37" stroke="#333" stroke-width="2" transform="rotate(-15 50 50)"/>
                    <rect x="38" y="38" width="30" height="24" fill="#8c5a2b" stroke="#333" stroke-width="2" transform="rotate(-15 50 50)"/>
                    <rect x="66" y="35" width="22" height="30" fill="#d4af37" stroke="#333" stroke-width="2" transform="rotate(-15 50 50)"/>
                    <ellipse cx="88" cy="38" rx="4" ry="15" fill="#88ccff" transform="rotate(-15 50 50)"/>
                </svg>`
            }
        };

        let currentTopicKey = null;
        let timerInterval = null;
        let seconds = 0;

        // 選擇題目功能
        function selectTopic(key) {
            currentTopicKey = key;
            const data = topics[key];

            // 更新按鈕樣式
            document.querySelectorAll('.topic-grid .btn').forEach(btn => btn.classList.remove('active'));
            if(event && event.target) {
                event.target.classList.add('active');
            }

            // 更新展示畫面
            document.getElementById('imageBox').innerHTML = data.svg;
            document.getElementById('targetTitle').innerText = data.title;
            document.getElementById('targetHint').innerText = data.hint;

            // 隱藏印章
            document.getElementById('stampBox').classList.remove('show');
        }

        // 隨機抽題
        function selectRandomTopic() {
            const keys = Object.keys(topics);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            const buttons = document.querySelectorAll('.topic-grid .btn');
            
            keys.forEach((k, idx) => {
                if(k === randomKey) {
                    buttons[idx].click();
                }
            });
        }

        // 蓋章動作 (挑戰成功 / 重來一次)
        function triggerStamp(type) {
            const stampBox = document.getElementById('stampBox');
            if(type === 'PASSED') {
                stampBox.innerText = "懸賞達成！";
                stampBox.style.color = "#28a745";
                stampBox.style.borderColor = "#28a745";
            } else {
                stampBox.innerText = "重來一次！";
                stampBox.style.color = "#a82222";
                stampBox.style.borderColor = "#a82222";
            }
            stampBox.classList.add('show');
        }

        // 計時器功能
        function toggleTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            } else {
                timerInterval = setInterval(() => {
                    seconds++;
                    const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
                    const secs = String(seconds % 60).padStart(2, '0');
                    document.getElementById('timer-display').innerText = `⏱️ ${mins}:${secs}`;
                }, 1000);
            }
        }

        // 全螢幕切換
        function toggleFullscreen() {
            const card = document.getElementById('wantedCard');
            card.classList.toggle('fullscreen-card');
        }

        // 語音朗讀台詞
        function speakLine(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 1;
                window.speechSynthesis.speak(utterance);
            }
        }

        // 預設選擇第一個題目
        selectTopic('flag');
    </script>
</body>
</html>
